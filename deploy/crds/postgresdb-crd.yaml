apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresdbs.bashketchum02.github.io
spec:
  group: bashketchum02.github.io
  names:
    kind: PostgresDB
    listKind: PostgresDBList
    plural: postgresdbs
    singular: postgresdb
    shortNames:
      - pgdb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - version
                - replicas
                - storage
              properties:
                version:
                  type: string
                  description: "PostgreSQL version (e.g., '16', '15', '14')"
                  enum: ["14", "15", "16"]
                replicas:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 10
                  description: "Number of PostgreSQL instances (1 = standalone, >1 = primary + replicas)"
                storage:
                  type: string
                  description: "Storage size for each instance (e.g., '10Gi')"
                  pattern: "^[0-9]+(Mi|Gi|Ti)$"
                resources:
                  type: object
                  description: "CPU and memory resource requirements"
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                backup:
                  type: object
                  description: "Backup configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    schedule:
                      type: string
                      description: "Cron schedule for backups (e.g., '0 2 * * *')"
                    retentionDays:
                      type: integer
                      format: int32
                      default: 7
                      minimum: 1
                      maximum: 365
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - ""
                    - Pending
                    - Creating
                    - Running
                    - Updating
                    - BackingUp
                    - Restoring
                    - Failed
                readyReplicas:
                  type: integer
                  format: int32
                lastBackupTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
